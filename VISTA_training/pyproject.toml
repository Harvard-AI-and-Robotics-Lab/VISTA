[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-training"
version = "0.1.0"
description = "VISTA InternVL3, Qwen3-VL, Gemma 3 training and Judge 3 evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.9.1", "torchvision==0.24.1", "torchaudio==2.9.1",
  "transformers==4.57.6", "accelerate==1.12.0", "peft==0.18.0",
  "numpy==2.2.6", "scipy==1.15.3", "pandas==2.3.3",
  "opencv-python==5.0.0.93", "soundfile==0.13.1", "PyYAML==6.0.3",
  "safetensors==0.7.0", "Pillow==12.0.0", "huggingface-hub==0.36.0",
  "tensorboard==2.20.0",
]

[tool.setuptools.packages.find]
include = ["vista_mm*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
